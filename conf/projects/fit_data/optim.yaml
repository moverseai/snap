# @package _global_

_moai_:
  _definitions_:
    _collections_:
      _optimizers_:
        optim_nerf: &optim_nerf
          # _type_: adam
          # _params_:
          #   lr: 1e-3
          #   amsgrad: true
          #   eps: 1e-9
          #   weight_decay: 0.0
          #   foreach: true # false
          #   capturable: false
          #   differentiable: false
          #   fused: false # true                  
          _type_: adamw # adam
          _params_:
            lr: 1e-3
            amsgrad: true
            eps: 1e-12
            weight_decay: 1e-5 # 0.1 # 1e-6
            foreach: true # false
            capturable: false
            differentiable: false
            fused: false # true
          _groups_: [model]
