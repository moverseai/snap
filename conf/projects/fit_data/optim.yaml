        color_loss:
          L2:
           gt: [mask, null]
           pred: [reconstructed_color, offsets] # [color] # [reconstructed_color]
           _weight_: [1.0, 1000.0]
           _reduction_: [sum, sum]
           _out_: [recon, geom_reg]
