# @package _global_

SUBSET: null # [6, 7] # [0, 3] # null # [6, 7] # null # [1, 2] # [0, 1, 2]
DATA_ROOT: ???
OFFSETS: ???
# SUBDIV: 1
SUBDIV: one
SUBDIV_LEVELS:
  zero: 0
  one: 1
  two: 2
SUBDIV_LEVELS_INDEX:
  zero: '0'
  one: '1'
  two: '2'
SUBDIV_INDEX: ${SUBDIV_LEVELS_INDEX.${SUBDIV}}

data:
  train:
    loader:
      shuffle: true
    iterator:
      start: 0
      step: 2 # 1
      end: 500 # 50 # 500
      datasets:
        subdivided_smpl:
          path: ${DATA_ROOT}
          subset: ${SUBSET}
          gender: ${oc.env:SMPL_GENDER}
          models_path: ${oc.env:SMPL_ROOT}
          offsets_path: ${oc.select:OFFSETS,null}
          level: ${SUBDIV_LEVELS.${SUBDIV}} # ${SUBDIV} # ${SUBDIV_LEVELS.${SUBDIV}}
        multiview_video:
          path: ${DATA_ROOT}
          subset: ${SUBSET}
          suffix: '_color' # '' # '_mask'
        multiview_mask_video:
          path: ${DATA_ROOT} #/masks
          subset: ${SUBSET}
          suffix: '_mask' # '' # '_mask'
