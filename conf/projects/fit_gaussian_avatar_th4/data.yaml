# @package _global_

SUBJECT: ???
DATA_ROOT: ???
SUBDIV: one
SUBDIV_LEVELS:
  zero: 0
  one: 1
  two: 2
SUBDIV_LEVELS_INDEX:
  zero: '0'
  one: '1'
  two: '2'
SUBDIV_INDEX: ${SUBDIV_LEVELS_INDEX.${SUBDIV}}
OFFSETS: ???

data:
  train:
    loader:
      shuffle: false
      prefetch_factor: 4
      persistent_workers: true
      num_workers: 4
    iterator:
      start: 0
      step: 10 # 1
      end: 2000 # 50 # 500
      datasets:
        thuman4:
          path: ${DATA_ROOT}
          subject: ${SUBJECT}          
          models_path: ${oc.env:SMPL_ROOT}
          level: ${SUBDIV_LEVELS.${SUBDIV}} # ${SUBDIV} # ${SUBDIV_LEVELS.${SUBDIV}}          
          offsets_path: ${oc.select:OFFSETS,null}
