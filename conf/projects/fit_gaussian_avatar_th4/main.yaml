defaults:
  ###### ENGINE
  - engine/runner: lightning
  - engine/modules: [import, manual_seed, rerun, numpy, precision]
  - engine/loggers: tabular

  # ###### DATA TEST
  - data/train/loader: torch
  - data/train/iterator: subset_zipped # indexed
  # - data/train/augmentation/albumentations: compose
  # - src/data/train/aug: euclidean_distance_transform
  - src/data/train: [thuman4]

  # ###### MODEL
  - model: moai
  # - model/components/tcnn: [encoding_fully_fused_mlp] # [encoding_mlp]
  - model/monads/geometry/projection: [opengl]
  - model/monads/geometry/rotation:
      [rotmat_to_unitquat, quaternion_composition, unitquat_to_rotmat]
  # - model/monads/render/splats: [gaussian_splat_rasterizer]
  - model/monads/render/splats: [gaussian_splat_rasterizer_ashawkey]
  - model/monads/render/nvdiffrast: [
        # mesh_silhouette,
        rasterize,
        attribute_interpolation,
        antialias,
        rasterized_foreground,
        foreground_remap,
      ]
  - model/monads/geometry/transformation: [inverse]
  - model/monads/geometry/mesh: [mesh_vertex_normals, mesh_face_normals]
  - model/monads/generation/matrix: [rotation3d]
  - model/monads/generation/tensor: [named_params, random] # [parameter]
  - model/monads/generation/splats: [gaussian_splat_parameters]
  - model/monads/geometry/transformation: [transform, rotate]
  - model/monads/tensor: [int32, detach]
  # - model/monads/filter/highpass: [sobel2d]
  - model/monads/math: [clamp] # [minmax_normalization]
  - src/monads: [rotate_spherical_harmonics]

  # OPTIMIZATION
  - model/parameters/groups:
      [model1, model2, model3, model4, model_groups1, model_groups2]
  - model/parameters/optimizers: [adam, adamw, lbfgsls]
  - model/objectives: [passthrough]
  - model/objectives/regression: [L2, L1, cosine_distance]
  - model/objectives/mesh:
      [
        surface_normal_consistency,
        laplacian_smoothness,
        face_area_consistency,
        surface_feature_consistency,
      ]
  - model/objectives/image: [intersection_over_union, structural_dissimilarity]
  - model/objectives/splats: [long_and_thin_penalty]

  # MONITORING
  - model/monitors/visualization/rerun:
      [triangle_mesh3d, multicam_posed_images, optimization_losses, config]
  - model/monitors/exporting/local: [mesh]
  - src/export: [offsets, splat_cloud]

  # ###### EXTRA FILES
  - data
  - options
  - model
  - monitoring
  - flows
  - optim
  - _moai_

  ###### HYDRA
  - override hydra/hydra_logging: moai
  - override hydra/job_logging: moai
