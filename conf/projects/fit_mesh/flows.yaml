# @package _global_

_moai_:
  _definitions_:
    _flows_:
      preproc:
        parameter:
          void:
            - betas
          _out_: [offsets]
        smpl:
          pose:
            - ${mi:"flatten(pose, 1)"}
          shape:
            - betas
          rotation:
            - global_orient
          translation:
            - transl
          _out_:
            - body
        mesh_vertex_normals:
          vertices: [body.vertices]
          faces: [body.faces]
          _out_: [vertex_normals]
        int32:
          tensor:
            - ${mi:"sq(body.faces, 0)"}
          _out_: [faces]
        _mi_:
          expression:
            - ${mi:"sq(extrinsics,0)"}
            - ${mi:"sq(intrinsics,0)"}
            - ${mi:"sq(color,0)"}
            - ${mi:"sq(mask,0)"}
            - ${mi:"extrinsics[:, 0:3, 0:3]"}
            - ${mi:"extrinsics[:, 0:3, 3]"}
            - ${mi:"transpose(rotation, 0, 2, 1)"}
            - ${mi:"zeros(color)"}
            - ${mi:"transpose(reconstructed_color, 0, 2, 3, 1)"}
            - ${mi:"vertex_normals.vectors * offsets"}
            - ${mi:"body.vertices + oriented_offsets"}
          _out_:
            - extrinsics
            - intrinsics
            - color
            - mask
            - rotation
            - translation
            - rotation_t
            - reconstructed_color
            - reconstructed_color
            - oriented_offsets
            - deformed_vertices
        transform:
          points: [deformed_vertices]
          rotation: [rotation_t]
          translation:
            - ${mi:"zeros(translation)"}
          _out_: [transformed_vertices]
        rotation3d:
          tensor: [transformed_vertices]
          _out_: [rot3d]
        rotate:
          points: [transformed_vertices]
          rotation: [rot3d]
          _out_: [transformed_vertices]
        opengl:
          intrinsics: [intrinsics]
          points: [transformed_vertices]
          rotation: [null]
          translation: [translation]
          _out_: [ndc]
        rasterize:
          ndc_vertices: [ndc]
          indices: [faces]
          resolution_image: [color]
          _out_: [rasterized]
        attribute_interpolation:
          attributes:
            - ${mi:"ones(body.vertices)"}
          rasterized: [rasterized.image]
          indices: [faces]
          derivatives: [rasterized.derivatives]
          _out_: [interpolated]
        antialias:
          attributes: [interpolated.image]
          rasterized: [rasterized.image]
          ndc_vertices: [ndc]
          indices: [faces]
          _out_: [silhouette]
      postproc:
        _mi_sil:
          expression:
            - ${mi:"silhouette[:, 0:1, :, :]"}
          _out_:
            - silhouette
        mesh_vertex_normals:
          vertices: [deformed_vertices, body.vertices]
          faces: [body.faces, body.faces]
          _out_: [deformed_vertex_normals, original_vertex_normals]
