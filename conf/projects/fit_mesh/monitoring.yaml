# @package _global_

_moai_:
  _definitions_:
    _collections_:
      _monitors_:
        optimization:
          optimization_losses:
            _params_:
              path: /plots
              keys:
                [recon, geom_reg, norm_reg, mesh_smooth, face_area, surf_reg]
        visualisation:
          multicam_posed_images:
            poses: [extrinsics, extrinsics, extrinsics]
            intrinsics: [intrinsics, intrinsics, intrinsics]
            images: [color, mask, silhouette]
            path: [/body/image, /body/mask, /body/pred]
          triangle_mesh3d:
            vertices: [deformed_vertices]
            normals: [deformed_vertex_normals.vectors]
            faces: [body.faces]
            color: [red]
            path: [/body/mesh]
        save_mesh:
          offsets:
            _params_:
              path: "."
          mesh:
            _params_:
              path: "."
              extension: obj
            vertices: [deformed_vertices]
            faces: [body.faces]

  _execution_:
    _monitoring_:
      _fit_:
        _stages_:
          nerf_step:
            _frequency_: 1
            _monitors_: [optimization]
        _batch_:
          _frequency_: 10
          _monitors_: [visualisation]
