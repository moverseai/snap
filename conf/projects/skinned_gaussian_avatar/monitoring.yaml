# @package _global_

_moai_:
  _definitions_:
    _collections_:
      _monitors_:
        optimization:
          optimization_losses:
            _params_:
              path: /plots
              mode: weighted
              keys: [
                  recon,
                  geom_reg,
                  norm_reg,
                  mesh_smooth,
                  face_area,
                  surf_reg,
                  color_loss,
                  ssim_loss,
                  gauss_reg_loss,
                  opac_reg_loss,
                  alpha_loss,
                ] 
        visualisation:
          config:
            _params_:
              path: '/config'
          multicam_posed_images:            
            poses: [extrinsics, extrinsics, extrinsics, extrinsics] 
            intrinsics: [intrinsics, intrinsics, intrinsics, intrinsics] 
            images: [masked_color, mask, splatted.alpha, splatted.color] 
            path: [/body/image, /body/mask, /body/pred/mask, /body/pred/raster]             
          triangle_mesh3d:
            vertices: [deformed_vertices] 
            normals: [deformed_vertex_normals.vectors]
            faces: [faces] 
            color: [red]
            path: [/body/mesh]        
        save_splat:
          splat_cloud:
            _params_:
              path: '.'
              method_type: ${METHOD}

  _execution_:
    _monitoring_:
      _fit_:
        _stages_:
        _batch_:
          _frequency_: 10
          _monitors_: [visualisation, optimization, save_splat]
