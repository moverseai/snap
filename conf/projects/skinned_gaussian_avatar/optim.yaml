# @package _global_

SIL_W: ???
GEOMREG_W: ???
SURF_W: ???
AREA_W: ???
LAP_W: ???
IMG_W: ???
SSIM_W: ???
GAUSSREG_W: ???
LONGTHIN_W: ???

nerf_LR: ???

_moai_:
  _definitions_:
    _collections_:
      _optimizers_:
        optim_nerf: &optim_nerf
          _type_: adam
          _params_:
            lr: ${oc.select:nerf_LR,1e-1} 
            amsgrad: false 
            eps: 1e-12
            weight_decay: 0.0
            foreach: false
            capturable: true
            differentiable: false
            fused: true 
          _groups_: [model_groups1] 
      _objectives_:               
        reconstruction_and_silhouette_loss:
          long_and_thin_penalty:
            scaling: [gaussian_scales]
            _weight_:
              - ${oc.select:LONGTHIN_W,1000.0}
            _reduction_: [mean]
            _out_: [long_n_thin]
          L2:             
            pred: [gaussian_params.scaling, neg_opacity, offsets]
            gt: [null, null, null]
            _weight_:
              - ${oc.select:GAUSSREG_W,10.0}
              - ${oc.select:GAUSSREG_W,10.0}
              - ${oc.select:GEOMREG_W,10.0}
            _reduction_: [mean, mean, mean]
            _out_: [gauss_reg_loss, opac_reg_loss, geom_reg]
          L1:
            gt: [masked_color, mask]
            pred: [splatted.color, splatted.alpha]
            _weight_:
              - ${oc.select:IMG_W,5800.0}
              - ${oc.select:SIL_W,1e4}
            _reduction_: [mean, mean]
            _out_: [color_loss, alpha_loss]
          structural_dissimilarity:
            gt: [masked_color]
            pred: [splatted.color]
            _weight_:
              - ${oc.select:SSIM_W,5200.0}
            _reduction_: [mean]
            _out_: [ssim_loss]                
          intersection_over_union:
           gt: [mask]
           pred: [splatted.alpha]
           _weight_: 
            - ${oc.select:SIL_W,1e4}
           _reduction_: [sum]
           _out_: [recon] 
          surface_normal_consistency:
            vertex_normals: [deformed_vertex_normals.vectors]
            faces: [faces]
            _weight_: 
              - ${oc.select:SURF_W,5.0}
            _reduction_: [mean]
            _out_: [surf_reg]
          surface_feature_consistency:
            vertex_features: [vertex_offsets]
            faces: [faces]
            _weight_:
              - ${oc.select:GEOMREG_W,10.0}
            _reduction_: [mean]
            _out_: [offset_mesh_reg]
          laplacian_smoothness:
            vertices: [deformed_vertices]
            faces: [faces] 
            _weight_: 
              - ${oc.select:LAP_W,5.0}
            _reduction_: [mean]
            _out_: [mesh_smooth]
          face_area_consistency:
            original: [original_vertex_normals.areas]
            deformed: [deformed_vertex_normals.areas]
            _weight_: 
              - ${oc.select:AREA_W,2e-1}
            _reduction_: [mean]
            _out_: [face_area]