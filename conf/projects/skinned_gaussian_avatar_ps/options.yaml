# @package _global_

experiment:
  name: ${action}_skga_ps_${SUBJECT}_${METHOD}
  batch_size: 1
  workers: 0

engine:
  runner:
    deterministic: false # required for index add ops
    devices: 1
    num_sanity_val_steps: 0
    max_epochs: 20

  modules:
    precision:
      precision: highest # highest
    rerun:
      name: ${experiment.name}
      memory_limit: 4GB
      world_coordinates: RDD # RDD # RUF
      # export: './rerun.rrd'
