# @package _global_

SUBSET: null # [6, 7] # [0, 3] # null # [6, 7] # null # [1, 2] # [0, 1, 2]
# SUBJECT: ???
TAKE: ???
# DATASET_PATH: ???
DATA_ROOT: ??? # ${DATASET_PATH}/${SUBJECT}
VIEWS: ???
SUBDIV: one
SUBDIV_LEVELS:
  zero: 0
  one: 1
  two: 2
SUBDIV_LEVELS_INDEX:
  zero: '0'
  one: '1'
  two: '2'
SUBDIV_INDEX: ${SUBDIV_LEVELS_INDEX.${SUBDIV}}
OFFSETS: ??? # ${DATASET_PATH}/moverse_${SUBJECT}_bundle_offsets.npz
TIME_SUBSAMPLING: ???

data:
  train:
    loader:
      shuffle: true
      prefetch_factor: null
      persistent_workers: false
      num_workers: 0
    iterator:
      start: 0
      step: ${TIME_SUBSAMPLING} # 1
      end: 2100 # 50 # 500
      datasets:
        # subdivided_smpl:
        #   path: ${DATA_ROOT}
        #   subset: ${SUBSET}
        #   gender: ${oc.env:SMPL_GENDER}
        #   models_path: ${oc.env:SMPL_ROOT}
        #   offsets_path: ${oc.select:OFFSETS,null}
        #   level: ${SUBDIV_LEVELS.${SUBDIV}} # ${SUBDIV} # ${SUBDIV_LEVELS.${SUBDIV}}
        multiview_video:
          path: ${DATA_ROOT}
          subset: ${SUBSET}
          suffix: '_color' # '' # '_mask'
        multiview_mask_video:
          path: ${DATA_ROOT} #/masks
          subset: ${SUBSET}
          suffix: '_mask' # '' # '_mask'
        subdivided_smpl_anim:
          anim_path: ${DATA_ROOT}/bundle.anim
          path: ${DATA_ROOT}
          gender: ${oc.env:SMPL_GENDER}
          models_path: ${oc.env:SMPL_ROOT}
          subset: ${SUBSET}
          offsets_path: ${oc.select:OFFSETS,null}
          level: ${SUBDIV_LEVELS.${SUBDIV}} # ${SUBDIV} # ${SUBDIV_LEVELS.${SUBDIV}}
  
  test:
    loader:
      shuffle: false
      prefetch_factor: null
      persistent_workers: false
      num_workers: 0
    iterator:
      start: 0
      step: 1 # 1
      end: 900 # 50 # 500
      datasets:
        subdivided_smpl:
          path: ${DATA_ROOT}
          subset: ${SUBSET}
          gender: ${oc.env:SMPL_GENDER}
          models_path: ${oc.env:SMPL_ROOT}
          offsets_path: ${oc.select:OFFSETS,null}
          level: ${SUBDIV_LEVELS.${SUBDIV}} # ${SUBDIV} # ${SUBDIV_LEVELS.${SUBDIV}}
        multiview_video:
          path: ${DATA_ROOT}
          subset: ${SUBSET}
          suffix: '_color' # '' # '_mask'
        multiview_mask_video:
          path: ${DATA_ROOT} #/masks
          subset: ${SUBSET}
          suffix: '_mask' # '' # '_mask'

