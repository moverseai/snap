# @package _global_

_moai_:
  _definitions_:
    _flows_:
      preproc:
        named_params: # parameter:
          void:
            - betas
          _out_: [params]
        # smpl:
        #   pose:
        #     - ${mi:"flatten(pose, 1)"}
        #   shape:
        #     - betas
        #   rotation:
        #     - global_orient
        #   translation:
        #     - transl
        #   _out_:
        #     - body
        # _mi_index:
        #   expression:
        #     - ${mi:"sq(vertices, 0)"}
        #   _out_: [vertices]
        mesh_vertex_normals: #TODO: animated normals
          vertices: [vertices]
          faces: [faces]
          _out_: [original_vertex_normals]
        int32:
          tensor:
            - ${mi:"sq(faces, 0)"}
          _out_: [faces_i32]
        _mi_:
          expression:
            # - ${mi:"params[:, 0:1]"}
            # - ${mi:"params[:, 1:4]"}
            - params.offsets
            # - params.latent
            - ${mi:"sq(extrinsics,0)"}
            # - ${mi:"transpose(extrinsics,0, 2, 1)"}
            - ${mi:"sq(intrinsics,0)"}
            - ${mi:"sq(mask,0)"}
            - ${mi:"extrinsics[:, 0:3, 0:3]"} # BATCHED
            - ${mi:"extrinsics[:, 0:3, 3]"} # BATCHED
            - ${mi:"transpose(rotation, 0, 2, 1)"} # BATCHED
            - ${mi:"original_vertex_normals.vectors * offsets"}
            - ${mi:"vertices + oriented_offsets"}
            # - ${mi:"vertices + offsets"}
            - ${mi:"sq(color,0)"}
            - ${mi:"sq(camera_position,0)"}
            - ${mi:"sq(view_projection_matrix,0)"}
            - ${mi:"sq(view_matrix,0)"}
            - ${mi:"unsq(offsets, 0)"}
          _out_:
            - offsets
            # - latent
            - extrinsics
            # - extrinsics
            - intrinsics
            - mask
            - rotation
            - translation
            - rotation_t
            - oriented_offsets
            - deformed_vertices
            - color
            - camera_position
            - view_projection_matrix
            - view_matrix
            - vertex_offsets
        transform:
          points:
            [deformed_vertices] # [deformed_vertices] # [body.vertices]
            # - ${mi:"body.vertices + offsets"}
          rotation: [rotation_t]
          translation: # [translation]
            - ${mi:"zeros(translation)"}
          _out_: [transformed_vertices]
        rotation3d:
          tensor: [transformed_vertices]
          _out_: [rot3d]
        rotate:
          points: [transformed_vertices]
          rotation: [rot3d]
          _out_: [transformed_vertices]
        opengl:
          intrinsics: [intrinsics]
          points: [transformed_vertices] # [body.vertices] # [rotated_vertices]
          rotation: [null] # [rotation]
          translation: [translation] # [null] # [translation]
          _out_: [ndc]
        rasterize:
          ndc_vertices: [ndc]
          indices: [faces_i32]
          resolution_image: [color]
          _out_: [rasterized]
      preproc_wo_offsets: 
        _mi_:
          expression:
            - ${mi:"sq(vertices, 0)"}          
            - ${mi:"sq(extrinsics,0)"}
            - ${mi:"sq(intrinsics,0)"}
            - ${mi:"sq(mask,0)"}
            - ${mi:"extrinsics[:, 0:3, 0:3]"} # BATCHED
            - ${mi:"extrinsics[:, 0:3, 3]"} # BATCHED
            - ${mi:"transpose(rotation, 0, 2, 1)"} # BATCHED
            - ${mi:"vertices"}
            - ${mi:"sq(color,0)"}
            - ${mi:"sq(camera_position,0)"}
            - ${mi:"sq(view_projection_matrix,0)"}
            - ${mi:"sq(view_matrix,0)"}
          _out_:
            - vertices
            - extrinsics
            - intrinsics
            - mask
            - rotation
            - translation
            - rotation_t
            - deformed_vertices
            - color
            - camera_position
            - view_projection_matrix
            - view_matrix
      postproc:
        mesh_vertex_normals:
          vertices: [deformed_vertices] #,  body.vertices]
          faces: [faces] # [body.faces, body.faces]
          _out_: [deformed_vertex_normals] # , original_vertex_normals]
      geom_preproc:
        attribute_interpolation:
          attributes:
            # - ${mi:"ones(body.vertices)"}
            - ${mi:"ones(vertices)"}
          rasterized: [rasterized.image]
          indices: [faces_i32]
          derivatives: [rasterized.derivatives]
          _out_: [interpolated]
        antialias:
          attributes: [interpolated.image]
          rasterized: [rasterized.image]
          ndc_vertices: [ndc]
          indices: [faces_i32]
          _out_: [silhouette]
      nerf_preproc:
        gaussian_splat_parameters:
          tensor: [deformed_vertices]
          _out_: [gaussian_params]
        random:
          tensor: [color]
          _out_: [random_color]
        _mi_nerf:
          expression:
            - ${mi:"mask * color"}            
            - ${mi:"zeros(color)"}
            - ${mi:"transpose(reconstructed_color, 0, 2, 3, 1)"}
            # - ${mi:"0.5 * (1.0 + tanh(latent))"}
            # - ${mi:"tanh(latent)"}
            - ${mi:"ones(color)"}
            - ${mi:"background * random_color"}
            - ${mi:"masked_color + (1.0 - mask) * random_background"}
            - ${mi:"gaussian_params.rotation"}
            - ${mi:"gaussian_params.scaling"}
          _out_:
            - masked_color
            - reconstructed_color
            - reconstructed_color
            # - latent
            - background
            - random_background
            - masked_color
            - gaussian_quats
            - gaussian_scales
        # attribute_interpolation:
        #   attributes: [latent]
        #   rasterized: [rasterized.image]
        #   indices: [faces]
        #   derivatives: [rasterized.derivatives]
        #   _out_: [rendered_features]

        # # antialias:
        # #   attributes: [rendered_features.image]
        # #   rasterized: [rasterized.image]
        # #   ndc_vertices: [ndc]
        # #   indices: [faces]
        # #   _out_: [rendered_features]
        
