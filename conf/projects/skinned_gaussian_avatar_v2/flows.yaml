      splats_none:
        _mi_expand:
          expression:
            - ${mi:"expand_batch_as(gaussian_quats, deformed_vertices)"}
          _out_: [gaussian_quats]
      splats_lbs:
        _mi_roll:
          expression:
            - ${mi:"roll(gaussian_quats, -1, -1)"}
            # - ${mi:"unsq(blended_transforms, 0)"}
          _out_: [gaussian_quats] # , blended_transforms]
        rotmat_to_unitquat:
          rotation:
            # - ${mi:"blended_transforms[0, :, :, 0:3, 0:3]"}
            - ${mi:"blended_transforms[:, :, 0:3, 0:3]"}
          _out_: [blended_quats]
        quaternion_composition:
          x: [blended_quats]
          y: [gaussian_quats]
          _out_: [gaussian_quats]
        _mi_unroll:
          expression:
            - ${mi:"roll(gaussian_quats, 1, -1)"}
          _out_: [gaussian_quats]
      splats_qlbs:
        quaternion_composition:
          x: 
            - ${mi:"blended_rotations_quat"}
          y: [gaussian_quats]
          _out_: [gaussian_quats]
        _mi_scaling:
          expression: #NOTE: need to update vertex/face areas used in objectives and here
            # - ${mi:"sqrt(unsq(deformed_vertex_normals.areas, 2) * gaussian_scales)"}
            - ${mi:"gaussian_scales"}
          _out_: [gaussian_scales]
      splat_sh0:
        _mi_gaussian:
          expression:
            - ${mi:"expand_batch_as(gaussian_params.spherical_harmonics_dc, deformed_vertices)"}
          _out_: [spherical_harmonics]
      splat_sh1:
        unitquat_to_rotmat:
          rotation:
            - ${mi:"roll(blended_rotations_quat, -1, -1)"}
          _out_: [sh_rotation]
        rotate_spherical_harmonics:
          rotations: [sh_rotation]
          sh1: [gaussian_params.spherical_harmonics_d1]
          _out_: [rotated_sh]
        _mi_gaussian:
          expression:
            - ${mi:"expand_batch_as(gaussian_params.spherical_harmonics_dc, deformed_vertices)"}
            - ${mi:"rotated_sh.sh1"}
            - ${mi:"cat(spherical_harmonics, spherical_harmonics1, -2)"}
          _out_: [spherical_harmonics, spherical_harmonics1, spherical_harmonics]
      splat_sh2:
        unitquat_to_rotmat:
          rotation:
            - ${mi:"roll(blended_rotations_quat, -1, -1)"}
          _out_: [sh_rotation]
        rotate_spherical_harmonics:
          rotations: [sh_rotation]
          sh1: [gaussian_params.spherical_harmonics_d1]
          sh2: [gaussian_params.spherical_harmonics_d2]
          _out_: [rotated_sh]
        _mi_gaussian:
          expression:
            - ${mi:"expand_batch_as(gaussian_params.spherical_harmonics_dc, deformed_vertices)"}
            - ${mi:"rotated_sh.sh1"}
            - ${mi:"rotated_sh.sh2"}
            - ${mi:"cat(spherical_harmonics, spherical_harmonics1, spherical_harmonics2, -2)"}
          _out_: [spherical_harmonics, spherical_harmonics1, spherical_harmonics2, spherical_harmonics]
      splat_sh3:
        unitquat_to_rotmat:
          rotation:
            - ${mi:"roll(blended_rotations_quat, -1, -1)"}
          _out_: [sh_rotation]
        rotate_spherical_harmonics:
          rotations: [sh_rotation]
          sh1: [gaussian_params.spherical_harmonics_d1]
          sh2: [gaussian_params.spherical_harmonics_d2]
          sh3: [gaussian_params.spherical_harmonics_d3]
          _out_: [rotated_sh]
        _mi_gaussian:
          expression:
            - ${mi:"expand_batch_as(gaussian_params.spherical_harmonics_dc, deformed_vertices)"}
            - ${mi:"sq(rotated_sh.sh1, 0)"}
            - ${mi:"sq(rotated_sh.sh2, 0)"}
            - ${mi:"sq(rotated_sh.sh3, 0)"}
            - ${mi:"cat(spherical_harmonics, spherical_harmonics1, spherical_harmonics2, spherical_harmonics3, -2)"}
          _out_: [spherical_harmonics, spherical_harmonics1, spherical_harmonics2, spherical_harmonics3, spherical_harmonics]
